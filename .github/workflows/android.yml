name: Build iTAG Controller APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Fix Gradle Build Configs
      run: |
        PROJECT_ROOT=$(find . -name "settings.gradle" -exec dirname {} \;)
        echo "Проект найден в папке: $PROJECT_ROOT"
        cd "$PROJECT_ROOT"
        
        # Исправляем несовместимость версий Gradle и Java на лету
        if [ -f build.gradle ]; then
          sed -i 's/id "com.android.application" version .*/id "com.android.application" version "8.2.2" apply false/g' build.gradle 2>/dev/null || true
        fi
        
        # Генерируем современный обертчик Gradle
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew
        
        # Запуск компиляции APK
        ./gradlew assembleRelease --no-daemon

    - name: Upload Artifact iTAG-Controller-APK
      uses: actions/upload-artifact@v4
      with:
        name: iTAG-Controller-APK
        path: "**/build/outputs/apk/release/*.apk"
