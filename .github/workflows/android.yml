name: Build iTAG Controller APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Initialize Gradle Wrapper inside project folder
      run: |
        cd iTAG_Controller_GitHub
        if [ ! -f gradlew ]; then
          gradle wrapper
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x iTAG_Controller_GitHub/gradlew

    - name: Build Assemble Release
      run: |
        cd iTAG_Controller_GitHub
        ./gradlew assembleRelease

    - name: Upload Artifact iTAG-Controller-APK
      uses: actions/upload-artifact@v4
      with:
        name: iTAG-Controller-APK
        path: iTAG_Controller_GitHub/app/build/outputs/apk/release/*.apk
